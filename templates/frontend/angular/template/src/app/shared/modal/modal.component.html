@if (open) {
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/40 p-4" (click)="close()">
    <div
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      class="w-full max-w-md rounded-lg border border-border bg-surface p-6 shadow-sm"
      (click)="$event.stopPropagation()"
    >
      <div class="mb-4 flex items-center justify-between">
        <h2 id="modal-title" class="text-lg font-semibold text-text">{{ modalTitle }}</h2>
        <button
          type="button"
          (click)="close()"
          aria-label="Close dialog"
          class="rounded-md p-1 text-muted hover:bg-background focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
        >
          ✕
        </button>
      </div>
      <ng-content></ng-content>
    </div>
  </div>
}
