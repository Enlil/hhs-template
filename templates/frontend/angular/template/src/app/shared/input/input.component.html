<div class="flex flex-col gap-1.5">
  @if (label) {
    <label [for]="inputId" class="text-sm font-medium text-text">{{ label }}</label>
  }
  <input
    [id]="inputId"
    [type]="type"
    [name]="name"
    [placeholder]="placeholder"
    [required]="required"
    class="rounded-md border border-border bg-surface px-3 py-2 text-sm text-text placeholder:text-muted focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primary"
  />
</div>
