<aside class="glass hidden w-[var(--sidebar-width)] shrink-0 self-start rounded-md p-4 sm:block">
  <nav aria-label="Sidebar" class="flex flex-col gap-2">
    @for (link of links; track link.path) {
      <a
        [routerLink]="link.path"
        routerLinkActive
        #rla="routerLinkActive"
        ariaCurrentWhenActive="page"
        [class]="linkClasses(rla.isActive)"
      >
        @if (link.icon) {
          <ng-icon [name]="link.icon" size="20" class="shrink-0" aria-hidden="true" />
        }
        {{ link.label }}
      </a>
    }
  </nav>
</aside>
