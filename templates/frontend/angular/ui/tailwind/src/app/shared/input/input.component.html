<div [class]="'flex flex-col gap-1 ' + className">
  @if (label) {
    <label [for]="inputId" class="text-content-2 text-muted">{{ label }}</label>
  }
  <div
    class="flex h-12 items-center gap-2 rounded-xl bg-surface px-5 focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-primary-vivid has-[input:disabled]:opacity-50"
  >
    @if (adornment) {
      <span class="text-content-3 text-subtle">{{ adornment }}</span>
    }
    <input
      [id]="inputId"
      [type]="type"
      [name]="name"
      [placeholder]="placeholder"
      [required]="required"
      [disabled]="disabled"
      [value]="value"
      [attr.inputmode]="inputMode || null"
      (input)="onInput($event)"
      class="min-w-0 flex-1 bg-transparent text-content-3 text-text outline-none placeholder:text-subtle"
    />
  </div>
</div>
