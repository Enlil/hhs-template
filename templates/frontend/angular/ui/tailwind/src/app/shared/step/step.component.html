<div
  [attr.aria-current]="active ? 'step' : null"
  [class]="'flex items-center gap-4 rounded-lg px-6 py-4 ' + (active ? 'bg-primary/20' : 'bg-surface/20')"
>
  <span
    [class]="
      'flex size-14 shrink-0 items-center justify-center rounded-pill font-title text-h2 ' +
      (active ? 'bg-primary text-primary-foreground' : 'bg-surface/60 text-text')
    "
  >
    {{ number }}
  </span>
  <span class="font-title text-h2 text-text">{{ label }}</span>
</div>
