<label [class]="'inline-flex items-center gap-4 text-content-3 text-text ' + className">
  <input
    type="radio"
    class="peer sr-only"
    [name]="name"
    [value]="value"
    [checked]="checked"
    [disabled]="disabled"
    (change)="onChange()"
  />
  <span
    class="flex size-6 shrink-0 items-center justify-center rounded-full border border-base-light bg-surface after:size-3 after:rounded-full after:bg-transparent peer-checked:border-primary peer-checked:after:bg-primary peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-primary-vivid peer-disabled:opacity-50"
  ></span>
  {{ label }}
</label>
