<div [class]="'flex flex-col gap-1 ' + className">
  @if (label) {
    <label [for]="selectId" class="text-content-2 text-muted">{{ label }}</label>
  }
  <div class="relative">
    <select
      #field
      [id]="selectId"
      [name]="name"
      [disabled]="disabled"
      (change)="onChange($event)"
      class="h-12 w-full appearance-none rounded-xl bg-surface pr-12 pl-5 text-content-3 text-text disabled:opacity-50"
    >
      <ng-content></ng-content>
    </select>
    <ng-icon
      name="heroChevronDownSolid"
      size="20"
      class="pointer-events-none absolute top-1/2 right-5 -translate-y-1/2 text-text"
      aria-hidden="true"
    />
  </div>
</div>
