<div role="group" [attr.aria-label]="label" class="inline-flex h-11 w-fit overflow-hidden rounded-pill bg-surface">
  @for (option of options; track option.value) {
    <button
      type="button"
      [attr.aria-pressed]="option.value === value"
      [attr.aria-label]="option.label"
      (click)="valueChange.emit(option.value)"
      [class]="
        'flex size-11 items-center justify-center rounded-pill transition-colors ' +
        (option.value === value ? 'bg-primary text-primary-foreground' : 'text-text hover:bg-primary-lighter')
      "
    >
      <ng-icon [name]="option.icon" size="20" aria-hidden="true" />
    </button>
  }
</div>
