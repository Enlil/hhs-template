<div
  role="search"
  [class]="
    'flex items-center gap-3 rounded-pill bg-surface/80 px-8 py-4 focus-within:outline-2 focus-within:outline-offset-2 focus-within:outline-primary-vivid ' +
    className
  "
>
  <ng-icon name="heroMagnifyingGlassSolid" size="24" class="shrink-0 text-text" aria-hidden="true" />
  <input
    type="search"
    aria-label="Search"
    [placeholder]="placeholder"
    (input)="onInput($event)"
    class="min-w-0 flex-1 bg-transparent text-content-1 text-text outline-none placeholder:text-subtle"
  />
</div>
