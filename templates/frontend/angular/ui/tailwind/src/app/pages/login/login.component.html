<div class="flex min-h-screen flex-col">
  <div class="flex flex-1 items-center justify-center px-4 py-8">
    <app-card class="w-full max-w-md" className="sm:p-8">
      <div class="mb-6 flex flex-col items-center gap-3 text-center">
        <img src="assets/hhs-logo.png" alt="Texas Health and Human Services" class="h-14 w-auto" />
        <h1>Sign in to {{ appName }}</h1>
      </div>
      <form class="flex flex-col gap-4" (submit)="handleSubmit($event)">
        <app-input label="Email" type="email" name="email" placeholder="you@example.com" [required]="true" />
        <app-input label="Password" type="password" name="password" placeholder="••••••••" [required]="true" />
        <app-button type="submit" className="mt-2 w-full">Sign In</app-button>
        <button type="button" class="text-content-3 text-primary-vivid hover:underline">Forgot password?</button>
      </form>
    </app-card>
  </div>
  <app-footer></app-footer>
</div>
